[workspace]
resolver = "2"
members = ["crates/protocol", "crates/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Bronzesakon"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# 操作系统 CSPRNG（Android 走 getrandom(2)，Windows 走 BCryptGenRandom）。
# UUID / 请求 id 会进配对流程，必须用密码学安全的随机源，不能用 hash 兜底。
getrandom = "0.3"

[profile.release]
# Android .so 走 release；体积与速度都按发布标准收紧。
lto = "thin"
codegen-units = 1
strip = "symbols"
# 刻意**不**设 `panic = "abort"`（即保持默认的 unwind）。
#
# 原因：本 crate 解的是网络来的字节，解析代码里任何一处下标越界或 unwrap 都会 panic。
# 用 abort，一次 panic 就是 SIGABRT、整个应用进程被杀；用 unwind，FFI 层可以在每个
# `extern "C"` 入口用 `std::panic::catch_unwind` 把它转成 Java 异常，用户看到的是
# 一次失败调用而不是应用闪退。
# 代价是二进制约大几十 KB，换一个"坏输入不炸应用"的保证，值。
# 注意：这条只有在 FFI 层真的写了 catch_unwind 才有意义——写 JNI 入口时别漏。
